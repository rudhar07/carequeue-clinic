{{- if not .Values.database.existingSecret }}
{{- /*
Database credentials. Defaults are FAKE demo values for kind/CI. For a real
cluster set database.existingSecret and create that Secret outside Git.
*/}}
{{- $user := .Values.postgresql.auth.username }}
{{- $password := .Values.postgresql.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carequeue.dbSecretName" . }}
  labels:
    {{- include "carequeue.componentLabels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" ($user | urlquery) ($password | urlquery) (include "carequeue.dbHost" .) .Values.database.port .Values.database.name | quote }}
{{- end }}
