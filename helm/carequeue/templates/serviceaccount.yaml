{{- if .Values.serviceAccount.create }}
# The app never talks to the Kubernetes API, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "carequeue.serviceAccountName" . }}
  labels:
    {{- include "carequeue.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
